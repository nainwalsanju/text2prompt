[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text2prompt"
version = "2.0.0"
description = "A blazing-fast, privacy-first, on-device prompt builder for macOS powered by Apple Intelligence"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["apple-intelligence", "prompt-engineering", "macos", "on-device-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
]
dependencies = [
    "apple-fm-sdk>=0.1.0",
    "pyperclip>=1.8.0",
    "pyobjc>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
text2prompt = "text2prompt.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
# PyObjC requires star imports and Apple delegate naming
extend-ignore = ["F403", "F405", "N802"]
# Long lines in template strings are acceptable
per-file-ignores = {}
"src/text2prompt/templates/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
